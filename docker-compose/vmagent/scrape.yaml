global:
  scrape_interval: "10s"

scrape_configs:
  - job_name: "victoria_metrics"
    static_configs:
      - targets: ["victoria-metrics:8428"]
  - job_name: "vmagent"
    static_configs:
      - targets: ["vmagent:8429"]
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
