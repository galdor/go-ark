services:
  grafana:
    image: "grafana/grafana:13.1"
    container_name: "ark-grafana"
    user: "root"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - "./docker-compose/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "grafana-data:/var/lib/grafana:rw"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: "victoriametrics-metrics-datasource"
    depends_on:
      victoria-metrics:
        condition: "service_healthy"
    restart: "unless-stopped"
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
  victoria-metrics:
    image: "victoriametrics/victoria-metrics:v1.153.0"
    container_name: "ark-victoria-metrics"
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:8428"
    ports: ["127.0.0.1:8428:8428"]
    volumes:
      - "victoria-metrics-data:/victoria-metrics-data:rw"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: "1s"
    restart: "unless-stopped"
    logging: *logging
  vmagent:
    image: "victoriametrics/vmagent:v1.153.0"
    container_name: "ark-vmagent"
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yaml"
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "-remoteWrite.tmpDataPath=/vmagent-data"
      - "-httpListenAddr=:8429"
    ports: ["127.0.0.1:8429:8429"]
    volumes:
      - "./docker-compose/vmagent/scrape.yaml:/etc/vmagent/scrape.yaml:ro"
      - "vmagent-data:/vmagent-data:rw"
    depends_on:
      victoria-metrics:
        condition: "service_healthy"
    restart: "unless-stopped"
    logging: *logging
volumes:
  grafana-data:
  victoria-metrics-data:
  vmagent-data:
